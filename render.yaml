
services:
  - type: web
    name: reparaciones
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://techfix-backend-z431.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
